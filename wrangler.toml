# Cloudflare Pages configuration.
#
# Two separate failures produced confusing symptoms here, so both are recorded:
#
# 1. `npx wrangler deploy` is the *Workers* command. On a Pages project it fails with
#    "Missing entry-point to Worker script or to assets directory", and the right one is
#    `wrangler pages deploy`. Pages itself never runs this file's build: the Git-connected
#    dashboard runs the build command from its own settings, then hands the directory
#    named by `pages_build_output_dir` to the edge.
#
# 2. With no build, Pages serves the repository root, which contains `web/index.html`
#    verbatim. That file's script tag points at `./src/main.ts`, and Pages returns `.ts`
#    with `video/mp2t` — the MPEG transport stream mapping, because the extension is
#    ambiguous between TypeScript and video. The browser refuses to execute a module
#    script with that type, so the page never boots.
#
# The Git-connected dashboard must be configured to match. Note that the current Pages UI
# has *two* separate fields, and this is where deployments usually go wrong:
#
#   Build command:            npm run build
#   Deploy command:           npx wrangler pages deploy web/dist
#   Root directory:           /   (the repository root)
#
# `npm run build` writes to `web/dist`, so the deploy command names that path. Leaving
# Deploy command as the Workers default, `npx wrangler deploy`, fails with "Missing
# entry-point to Worker script or to assets directory" — it is the Workers command and
# this is a Pages project. Putting `npm run build` in Deploy command instead of Build
# command also works mechanically, but Pages then has no build step of its own, which is
# what produces "Detected the following tools from environment:" with nothing after it.
#
# The root `package.json` declares an npm workspace covering `web/`. That matters: Pages
# runs `npm clean-install` at the root, and a root manifest with no dependencies installs
# nothing — `web/node_modules` is never created and the build dies with
# "sh: 1: vue-tsc: not found". With the workspace declared, one install at the root
# hoists every dependency and the build finds its binaries.
#
# `npm run build` deliberately does NOT rebuild the wasm. Cloudflare's Pages image has no
# Rust toolchain and no `wasm32-unknown-unknown` target, so `npm run wasm` would fail
# there. That is why `web/src/legalpdf.wasm` is committed: the deploy compiles only the
# TypeScript and ships the module the Rust source currently builds to. Rebuild it with
# `npm run build:wasm` and commit the result whenever the engine changes.

name = "lexparser"
pages_build_output_dir = "web/dist"
compatibility_date = "2026-01-01"
