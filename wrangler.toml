# Cloudflare Workers configuration with Static Assets.
#
# When connecting this repository to Cloudflare (Workers Builds), configure the
# Build settings in the Cloudflare dashboard as follows:
#
#   Build command:    npm run build
#   Deploy command:   npx wrangler deploy
#   Root directory:   /   (the repository root)
#
# Why this configuration:
# 1. `[assets]` configures Cloudflare to deploy and host the static files in `web/dist`
#    directly via the Workers edge network with SPA routing enabled.
# 2. `npx wrangler deploy` is the native Workers deploy command. Unlike `wrangler pages deploy`,
#    it uses the standard Workers API and the ambient Workers credentials provided by
#    Cloudflare Workers Builds without triggering API authentication errors (code: 10000).
# 3. The root `package.json` declares an npm workspace covering `web/`. When Pages / Workers
#    runs `npm clean-install` at root, dependencies are hoisted so `vue-tsc` and `vite` are found.
# 4. `npm run build` at root invokes `npm run build:web --workspace web`, deliberately skipping
#    Rust/WASM compilation (since Cloudflare's build image lacks the wasm32 target).
#    The precompiled `web/src/legalpdf.wasm` is shipped directly. Rebuild the WASM locally
#    with `npm run build:wasm` and commit whenever the Rust engine changes.

name = "lexparser"
compatibility_date = "2026-01-01"

[assets]
directory = "web/dist"
not_found_handling = "single-page-application"
